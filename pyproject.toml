[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-core"
# 版本号单一来源是 nl2sql/__init__.py:__version__，这里动态读，不再手写一份。
# 三处（本文件 / nl2sql/__init__.py / apps/web/frontend/package.json）是否一致
# 由 `python scripts/check_version.py` 检查，且已接进 pre-commit。
dynamic = ["version"]
description = "自然语言查询数仓的核心引擎：多数据源 + 可自定义 RAG 智库 + 可插拔智能体组件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# 核心依赖刻意保持极小：个人场景零配置优先
dependencies = []

[project.optional-dependencies]
# 方言的"语法体检"（可选）：装上就多一道解析告警，没装不影响编译。
# 编译本身不依赖它——逻辑计划到 SQL 是确定性拼装，不做 AST 改写。
semantic = ["sqlglot>=23.0", "pyyaml>=6.0"]
# MySQL 数据源。直接用 pymysql，不引入 SQLAlchemy：
# 适配器要的是"执行 + 描述结果"，ORM 那一层只会挡住方言细节（比如 %s 占位符）。
mysql = ["pymysql>=1.1"]
# PostgreSQL 数据源（第三引擎）。psycopg3，同样不走 SQLAlchemy。
postgres = ["psycopg[binary]>=3.1"]
# 编排引擎
agent = ["langgraph>=0.2"]
# 本地 Web 后端
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# 开发工具
dev = ["pytest>=8.0", "pandas>=2.0"]

[tool.setuptools.dynamic]
version = { attr = "nl2sql.__version__" }

# 自动发现 nl2sql 下所有子包。
# 原先手写 11 个包名，漏了 llm / plugins / skills 三个 ——
# 那种清单一定会随新增模块而过期，而且过期了没人会发现（本地跑得通，
# 只有 pip install 之后才炸）。改成 find 一劳永逸。
[tool.setuptools.packages.find]
include = ["nl2sql*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# apps/ 不打包进核心分发物：三个壳各自独立构建。
# 这样核心可被第三方直接 pip install，而不被迫带上 FastAPI。
# ---------------------------------------------------------------------------
